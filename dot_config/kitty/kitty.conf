# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="0xProto Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16
# END_KITTY_FONTS

# TRANSPARENCY
background_opacity 0.95


# LAYOUT
enabled_layouts tall,*

# WINDOWS
window_margin_width 7
window_border_width 3pt

# FIX OPTION ALT
macos_option_as_alt yes

# TABS
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol *
